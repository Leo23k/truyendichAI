<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Leo Truyen{% endblock %}</title>
  <meta name="theme-color" content="#171a1e">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>document.documentElement.dataset.theme=localStorage.getItem("app-theme")||"dark";</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script>htmx.config.responseHandling = [{code: "204", swap: false}, {code: "[23]xx", swap: true}, {code: "[45]xx", swap: true, error: true}];</script>
  <script defer src="/static/offline.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
    }
  </script>
  <style>
    :root{color-scheme:dark;--page:#1b1e22;--surface:#22262a;--surface-2:#292d32;--surface-3:#31363c;--line:#343a40;--text:#f4f5f5;--muted:#a9afb7;--accent:#35aaa0;--accent-strong:#26988e;--accent-ink:#062b28;--danger:#fb7185;--shadow:0 18px 45px rgba(0,0,0,.22)}
    html[data-theme="light"]{color-scheme:light;--page:#f5f6f7;--surface:#fff;--surface-2:#f7f8f9;--surface-3:#eceff1;--line:#dfe3e7;--text:#17191c;--muted:#656d76;--accent:#159c91;--accent-strong:#0f8279;--danger:#dc3651;--shadow:0 18px 45px rgba(23,25,28,.09)}
    [x-cloak]{display:none!important}.htmx-indicator{display:none}.htmx-request .htmx-indicator,.htmx-request.htmx-indicator{display:inline-flex}.crawl-progress-panel{display:none}.crawl-progress-panel.is-active{display:block}
    *{scrollbar-color:var(--surface-3) transparent}.site-body{background:var(--page);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif;transition:background .2s ease,color .2s ease}.site-header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(16px)}.site-nav-button{display:inline-flex;min-height:2.5rem;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:.5rem;padding:0 .85rem;color:var(--text);font-size:.875rem;font-weight:650;transition:.16s ease}.site-nav-button:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--surface-2)}.site-nav-button.accent{border-color:transparent;background:var(--accent);color:#062b28}.site-nav-button.accent:hover{background:var(--accent-strong)}
    .site-page{min-height:calc(100vh - 4.25rem);max-width:76rem;margin:0 auto;padding:2rem 1.25rem 5rem}.site-panel{border:1px solid var(--line);border-radius:.75rem;background:var(--surface)}.site-title{color:var(--text);font-weight:800;letter-spacing:-.035em}.site-muted{color:var(--muted)}.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--line);border-radius:.75rem;background:var(--surface);padding:.65rem}.library-search{border-color:var(--line)!important;background:var(--surface-2)!important;box-shadow:none!important}.library-search input{color:var(--text)!important}.library-card{overflow:hidden;border:1px solid var(--line);border-radius:.65rem;background:var(--surface-2);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.library-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--shadow)}.library-card h2{color:var(--text)!important}.library-card p,.library-card span{color:var(--muted)}.library-card .card-primary{background:var(--accent);color:#062b28}.library-card .card-primary span{color:#062b28}.book-cover-fallback{background:var(--surface-3);color:var(--muted)}
    .book-hero{display:grid;gap:2rem;border-bottom:1px solid var(--line);padding:1.5rem 0 2.5rem}.book-cover{overflow:hidden;border:1px solid var(--line);border-radius:.55rem;background:var(--surface-2);box-shadow:var(--shadow)}.book-copy h1{color:var(--text)!important}.book-copy p{color:var(--muted)!important}.book-action{display:inline-flex;min-height:2.75rem;align-items:center;justify-content:center;gap:.55rem;border:1px solid var(--line);border-radius:.45rem;padding:0 1.25rem;font-weight:700;color:var(--text);transition:.16s ease}.book-action:hover{border-color:var(--accent);background:var(--surface-2)}.book-action.primary{border-color:transparent;background:var(--accent);color:#062b28}.chapter-directory,#chapter-list{border-color:var(--line)!important;background:var(--surface)!important;box-shadow:none!important}.chapter-directory h2,#chapter-list h2{color:var(--text)!important}.chapter-directory select,#chapter-list select{border-color:var(--line)!important;background:var(--surface-2)!important;color:var(--text)!important}.chapter-directory a,#chapter-list a{border-color:var(--line)!important;color:var(--text)!important}.chapter-directory a:hover,#chapter-list a:hover{background:var(--surface-3)!important}.chapter-directory [x-ref="chapterList"],#chapter-list [data-chapter-scroll]{border-color:var(--line)!important;background:var(--surface-2)}
    :is(.site-page,.app-shell) :is(.text-stone-950,.text-stone-900,.text-stone-800,.text-stone-700){color:var(--text)!important}:is(.site-page,.app-shell) :is(.text-stone-600,.text-stone-500,.text-stone-400){color:var(--muted)!important}:is(.site-page,.app-shell) :is(.bg-white,.bg-stone-50,.bg-stone-50\/70){background:var(--surface)!important}:is(.site-page,.app-shell) :is(.border-stone-100,.border-stone-200,.border-stone-300){border-color:var(--line)!important}
    .reader-content{font-family:"Segoe UI","Noto Sans",Arial,sans-serif;letter-spacing:0;word-spacing:normal;text-rendering:optimizeLegibility}.reader-prose p{margin-bottom:1.65em}.app-shell{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}.icon-button{display:inline-flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:10px}.icon-button:hover{background:var(--surface-3)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(min-width:768px){.book-hero{grid-template-columns:240px minmax(0,1fr);align-items:start}.site-page{padding-top:2.75rem}#chapter-list [data-chapter-scroll]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}#chapter-list [data-chapter-scroll] a:nth-child(odd){border-right:1px solid var(--line)}}@media(max-width:767px){.site-header .desktop-only{display:none}.site-page{padding:1.25rem .9rem 4rem}.library-toolbar{align-items:stretch;flex-direction:column}.book-cover{max-width:180px;margin:auto}.book-copy{text-align:center}.book-copy .book-actions{justify-content:center}.site-nav-button{padding:0 .65rem}.site-brand-label{display:none}}
  </style>
  <script>
    (() => {
      const setProgress = (wrapper, value) => {
        const bar = wrapper.querySelector("[data-progress-bar]");
        const label = wrapper.querySelector("[data-progress-value]");
        if (bar) bar.style.width = `${value}%`;
        if (label) label.textContent = `${value}%`;
      };
      document.addEventListener("htmx:beforeRequest", (event) => {
        const form = event.detail.elt;
        const wrapper = form.closest("[data-crawl-progress]");
        if (!wrapper) return;
        const panel = wrapper.querySelector(".crawl-progress-panel");
        if (!panel) return;
        const status = wrapper.querySelector("#lookup-status");
        const value = form.querySelector('input[name="query"]')?.value.trim() || "";
        if (status) status.textContent = value.startsWith("http://") || value.startsWith("https://") ? "Đang nhập truyện từ link..." : "Đang tìm truyện...";
        panel.classList.add("is-active");
        setProgress(wrapper, 5);
        clearInterval(wrapper._progressTimer);
        wrapper._progressTimer = setInterval(() => {
          const current = Number(wrapper.querySelector("[data-progress-value]")?.textContent.replace("%", "") || 5);
          setProgress(wrapper, Math.min(90, current + Math.ceil(Math.random() * 8)));
        }, 350);
      });
      document.addEventListener("htmx:afterRequest", (event) => {
        const form = event.detail.elt;
        const wrapper = form.closest("[data-crawl-progress]");
        if (!wrapper) return;
        clearInterval(wrapper._progressTimer);
        setProgress(wrapper, 100);
        const status = wrapper.querySelector("#lookup-status");
        if (status) status.textContent = event.detail.successful ? "Đã xử lý xong." : "Không xử lý được yêu cầu.";
        setTimeout(() => wrapper.querySelector(".crawl-progress-panel")?.classList.remove("is-active"), 450);
      });
      window.startCrawlProgress = (form) => {
        const wrapper = form.closest("[data-crawl-progress]");
        if (!wrapper) return true;
        const panel = wrapper.querySelector(".crawl-progress-panel");
        const status = wrapper.querySelector("#lookup-status");
        const value = form.querySelector('input[name="query"]')?.value.trim() || "";
        if (status) status.textContent = value.startsWith("http://") || value.startsWith("https://") ? "Đang nhập truyện từ link..." : "Đang tìm truyện...";
        panel?.classList.add("is-active");
        setProgress(wrapper, 5);
        clearInterval(wrapper._progressTimer);
        wrapper._progressTimer = setInterval(() => {
          const current = Number(wrapper.querySelector("[data-progress-value]")?.textContent.replace("%", "") || 5);
          setProgress(wrapper, Math.min(90, current + Math.ceil(Math.random() * 8)));
        }, 350);
        return true;
      };
      window.startTranslationProgress = (link) => {
        const panel = document.querySelector("[data-translation-progress]");
        if (!panel) return true;
        panel.classList.add("is-active");
        const bar = panel.querySelector("[data-progress-bar]");
        const label = panel.querySelector("[data-progress-value]");
        let value = 5;
        if (bar) bar.style.width = "5%";
        if (label) label.textContent = "5%";
        clearInterval(window._translationTimer);
        window._translationTimer = setInterval(() => { value = Math.min(90, value + Math.ceil(Math.random() * 8)); if (bar) bar.style.width = `${value}%`; if (label) label.textContent = `${value}%`; }, 350);
        return true;
      };
      document.addEventListener("DOMContentLoaded", () => {
        window.lucide?.createIcons();
        let jobsRefreshTimer;
        const refreshJobs = async () => {
          const current = document.querySelector("[data-jobs-refresh]");
          if (!current) return;
          if (document.querySelector('form[hx-post="/jobs/crawler/search"].htmx-request')) {
            jobsRefreshTimer = window.setTimeout(refreshJobs, 1000);
            return;
          }
          try {
            const response = await fetch(`/jobs/list?_=${Date.now()}`, {
              cache: "no-store",
              headers: { "HX-Request": "true" },
            });
            if (!response.ok) throw new Error(`Job refresh failed: ${response.status}`);
            const documentSnapshot = new DOMParser().parseFromString(await response.text(), "text/html");
            const updated = documentSnapshot.querySelector("[data-jobs-refresh]");
            if (!updated) throw new Error("Job refresh response has no job list");
            // Never replace the Admin · Crawler card.  Refresh only the two
            // direct child regions that show live crawl/translation progress.
            const liveParts = Array.from(current.children).filter((part) =>
              part.matches(".space-y-4") || part.matches("section.mt-10")
            );
            const incomingLiveParts = Array.from(updated.children).filter((part) =>
              part.matches(".space-y-4") || part.matches("section.mt-10")
            );
            for (const [index, existingPart] of liveParts.entries()) {
              const incomingPart = incomingLiveParts[index];
              if (!incomingPart) continue;
              existingPart.replaceWith(incomingPart);
              window.Alpine?.initTree(incomingPart);
              window.htmx?.process(incomingPart);
            }
            window.lucide?.createIcons();
          } catch (error) {
            console.warn("Could not refresh crawl jobs", error);
          } finally {
            if (document.querySelector("[data-jobs-refresh]")) {
              jobsRefreshTimer = window.setTimeout(refreshJobs, 3000);
            }
          }
        };
        if (document.querySelector("[data-jobs-refresh]")) {
          jobsRefreshTimer = window.setTimeout(refreshJobs, 3000);
          window.addEventListener("pagehide", () => clearTimeout(jobsRefreshTimer), { once: true });
        }
      });
      document.addEventListener("htmx:afterSettle", () => window.lucide?.createIcons());
    })();
  </script>
</head>
<body class="site-body min-h-screen">
  {% block header %}
  <header class="site-header sticky top-0 z-40">
    <div class="mx-auto flex h-[68px] max-w-[1380px] items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="/" class="flex items-center gap-2.5 font-semibold tracking-tight text-[var(--text)]"><span class="grid h-9 w-9 place-items-center rounded-full bg-[var(--accent)] text-[var(--accent-ink)]"><i data-lucide="book-open" class="h-5 w-5"></i></span><span class="text-lg">Leo Truyện</span></a>
      <nav class="ml-auto flex items-center gap-2 text-sm">
        {% if request.state.user.role == 'admin' %}<a href="/?restore=1" class="site-nav-button desktop-only"><i data-lucide="rotate-ccw" class="h-4 w-4"></i>Restore</a><a href="/retranslate" class="site-nav-button desktop-only"><i data-lucide="languages" class="h-4 w-4"></i>Dịch lại truyện</a><a href="/jobs" class="site-nav-button accent"><i data-lucide="wrench" class="h-4 w-4"></i><span class="desktop-only">Tiến trình</span><span class="sm:hidden">Jobs</span></a>{% endif %}
        {% if request.url.path == '/' %}<button type="button" data-theme-toggle class="icon-button h-9 w-9" aria-label="Đổi giao diện sáng hoặc tối" title="Đổi giao diện"><i data-lucide="sun-moon" class="h-4 w-4"></i></button>{% endif %}
        <div x-data="{ open: false }" @click.outside="open = false" class="relative ml-1 border-l border-[var(--line)] pl-3">
          <button type="button" @click="open = !open" @keydown.escape.window="open = false" :aria-expanded="open" class="flex items-center gap-2 text-[var(--text)]" aria-label="Mở menu tài khoản">
            <span class="grid h-8 w-8 place-items-center rounded-full bg-orange-500 font-semibold text-white">{{ request.state.user.display_name[:1]|upper }}</span>
            <span class="desktop-only max-w-28 truncate font-medium">{{ request.state.user.display_name }}</span>
          </button>
          <div x-cloak x-show="open" x-transition.origin.top.right class="absolute right-0 mt-3 w-40 overflow-hidden rounded-lg border border-[var(--line)] bg-[var(--surface)] p-1 shadow-xl">
            <a href="/logout" class="flex min-h-10 items-center gap-2 rounded-md px-3 text-sm font-medium text-[var(--text)] hover:bg-[var(--surface-3)]"><i data-lucide="log-out" class="h-4 w-4"></i>Đăng xuất</a>
          </div>
        </div>
      </nav>
    </div>
  </header>
  {% endblock %}
  <main class="{% block main_class %}mx-auto max-w-6xl px-6 py-10{% endblock %}">{% block content %}{% endblock %}</main>
  <script>
    document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem("app-theme", nextTheme);
      });
    });
  </script>
</body>
</html>
