{% for chapter in chapters %}
<a data-offline-chapter data-chapter-id="{{ chapter.id }}" href="/truyen/{{ slug }}/{{ chapter.chapter_number }}" class="flex min-h-12 border-b border-stone-100 px-4 py-3 last:border-b-0 hover:bg-stone-50"><span class="mr-2 shrink-0 text-stone-400">#{{ chapter.chapter_number }}</span><span class="min-w-0 truncate">{{ chapter.title }}</span></a>
{% endfor %}
<div id="chapters-more" hx-swap-oob="true" class="mt-3 text-center">{% if has_more %}<button type="button" hx-get="/truyen/{{ slug }}/chapters?offset={{ next_offset }}" hx-target="#chapter-items" hx-swap="beforeend" class="rounded-md border border-stone-200 bg-white px-4 py-2 text-sm font-medium hover:bg-stone-50">Tải thêm chương</button>{% endif %}</div>
