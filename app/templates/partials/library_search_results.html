{% if results %}<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">{% for book in results %}<a href="/synced/{{ book.slug }}" class="rounded-lg border border-stone-200 bg-white p-4 hover:border-teal-400"><p class="font-semibold text-stone-900">{{ book.title }}</p><p class="mt-1 text-sm text-stone-500">{{ book.author or 'Chưa rõ tác giả' }}</p></a>{% endfor %}</div>{% else %}<p class="rounded-lg border border-dashed border-stone-300 bg-white p-5 text-sm text-stone-500">Không tìm thấy truyện trong thư viện.</p>{% endif %}
