{% if message %}
<div {% if request.state.crawl_job_id %}data-crawl-job="{{ request.state.crawl_job_id }}"{% endif %} class="rounded-md border px-4 py-3 text-sm {% if error %}border-red-200 bg-red-50 text-red-800{% else %}border-teal-200 bg-teal-50 text-teal-900{% endif %}" role="{% if error %}alert{% else %}status{% endif %}">
  <div>{{ message }}</div>
  {% if book %}
  <a href="/books/{{ book.id }}" class="mt-3 inline-flex h-9 items-center rounded-md bg-stone-950 px-3 text-sm font-medium text-white hover:bg-stone-800">Mở truyện</a>
  {% endif %}
</div>
{% endif %}
