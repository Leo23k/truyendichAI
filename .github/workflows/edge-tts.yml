name: edge-tts

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - infra/tts/requirements.txt
      - app/tts/**
      - tests/test_edge_tts_remote.py
      - .github/workflows/edge-tts.yml
  push:
    branches: [main]
    paths:
      - requirements.txt
      - infra/tts/requirements.txt
      - app/tts/**
      - tests/test_edge_tts_remote.py
      - .github/workflows/edge-tts.yml

permissions:
  contents: read

concurrency:
  group: edge-tts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency contract
        run: |
          python - <<'PY'
          import importlib.metadata
          import re
          from pathlib import Path

          declared = []
          for filename in ("requirements.txt", "infra/tts/requirements.txt"):
              match = re.search(r"^edge-tts==([^\s#]+)", Path(filename).read_text(), re.MULTILINE)
              if not match:
                  raise SystemExit(f"edge-tts is not pinned in {filename}")
              declared.append(match.group(1))
          if len(set(declared)) != 1:
              raise SystemExit(f"edge-tts version mismatch: {declared}")

          import edge_tts

          installed = importlib.metadata.version("edge-tts")
          if installed != declared[0]:
              raise SystemExit(f"installed edge-tts {installed} != declared {declared[0]}")
          print(f"edge-tts {installed}: {edge_tts.__file__}")
          PY
          python -m compileall -q app/tts
      - name: Run Edge TTS regression tests
        run: python -m pytest tests/test_edge_tts_remote.py -q
      - name: Smoke test real Vietnamese audio
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          VOICES = ("vi-VN-NamMinhNeural", "vi-VN-HoaiMyNeural")

          async def synthesize(voice: str) -> None:
              data = bytearray()
              async with asyncio.timeout(45):
                  async for event in edge_tts.Communicate(
                      "Xin chào, đây là bài kiểm tra Edge TTS.", voice, rate="+0%"
                  ).stream():
                      if event["type"] == "audio" and event["data"]:
                          data.extend(event["data"])
              if not data:
                  raise RuntimeError(f"{voice}: provider returned empty audio")
              is_mp3 = data.startswith(b"ID3") or (
                  len(data) >= 2 and data[0] == 0xFF and data[1] & 0xE0 == 0xE0
              )
              if not is_mp3:
                  raise RuntimeError(f"{voice}: provider returned non-audio bytes")
              print(f"{voice}: {len(data)} bytes of MP3 audio")

          async def main() -> None:
              for voice in VOICES:
                  await synthesize(voice)

          asyncio.run(main())
          PY
